client_id = "f2f34d1691ccbc32d9abf403695d0f9c"
name = "Mileyo Subcription Os Dev"
application_url = "https://116cbd82be5f.ngrok.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-billing-attempts/success"
  topics = [ "subscription_billing_attempts/success" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-billing-attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-billing-attempts/challenged"
  topics = [ "subscription_billing_attempts/challenged" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-contracts"
  topics = [
    "subscription_contracts/activate",
    "subscription_contracts/cancel",
    "subscription_contracts/expire",
    "subscription_contracts/fail",
    "subscription_contracts/pause",
    "subscription_contracts/update",
  ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# TODO(dunning): After merging, deploy updated Shopify app config and reinstall / approve
# new scopes on each shop (dev + production): read_customers, write_customers.
# Required for customerPaymentMethodSendUpdateEmail (secure payment-method update emails).
scopes = "read_orders,read_own_subscription_contracts,write_metaobject_definitions,write_metaobjects,write_own_subscription_contracts,write_products,read_customers,write_customers"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[app_proxy]
url = "https://116cbd82be5f.ngrok.app/apps/box-builder"
subpath = "box-builder"
prefix = "apps"
