# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b2ca390f61d777ae3c4f87ecc30648a6"
name = "Mileyo Subscription Os"
application_url = "https://app.mileyo.fr/"
embedded = true

[app_proxy]
url = "https://app.mileyo.fr/apps/box-builder"
subpath = "box-builder"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-billing-attempts/success"
  topics = [ "subscription_billing_attempts/success" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-billing-attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-billing-attempts/challenged"
  topics = [ "subscription_billing_attempts/challenged" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription-contracts"
  topics = [
    "subscription_contracts/activate",
    "subscription_contracts/cancel",
    "subscription_contracts/expire",
    "subscription_contracts/fail",
    "subscription_contracts/pause",
    "subscription_contracts/update",
  ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# TODO(dunning): After merging, deploy updated Shopify app config and reinstall / approve
# new scopes on each shop (dev + production): read_customers, write_customers.
# Required for customerPaymentMethodSendUpdateEmail (secure payment-method update emails).
# TODO(box-v2-inventory): After merging, deploy updated Shopify app config and reinstall /
# approve new scopes on each shop (dev + production): read_locations, write_inventory.
# Required to activate Box V2 InventoryItems at Online Store fulfillment locations.
scopes = "write_metaobject_definitions,write_metaobjects,read_orders,write_products,read_own_subscription_contracts,write_own_subscription_contracts,read_customers,write_customers,read_locations,write_inventory,unauthenticated_read_product_listings,unauthenticated_read_checkouts,unauthenticated_write_checkouts,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://app.mileyo.fr/auth/callback",
  "https://app.mileyo.fr/auth/shopify/callback"
]


[build]
automatically_update_urls_on_dev = true